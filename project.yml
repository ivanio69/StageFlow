name: StageFlow
options:
  bundleIdPrefix: com.stageflow
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
targets:
  StageFlow:
    type: application
    platform: iOS
    sources:
      - path: StageFlowApp
      - path: StageFlowShared
      - path: StageFlowLiveActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stageflow.app
        INFOPLIST_KEY_CFBundleDisplayName: StageFlow
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: StageFlowWatch
        embed: true
      - target: StageFlowLiveActivity
        embed: true
  StageFlowWatch:
    type: application
    platform: watchOS
    sources:
      - path: StageFlowWatchApp
      - path: StageFlowShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stageflow.app.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: StageFlow
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.stageflow.app
  StageFlowLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: StageFlowLiveActivity
      - path: StageFlowLiveActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stageflow.app.liveactivity
        INFOPLIST_KEY_CFBundleDisplayName: StageFlow
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
